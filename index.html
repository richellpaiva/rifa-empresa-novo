<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa da Empresa</title>
</head>
<body>

  <h1>Rifa da Empresa</h1>

  <div id="numeros" style="display:flex;flex-wrap:wrap;gap:5px;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // COPIE ESTES DADOS DIRETAMENTE DO SUPABASE
    const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';

    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function carregarNumeros() {

      const container = document.getElementById('numeros');

      container.innerHTML = 'Carregando...';

      const { data, error } = await supabaseClient
        .from('numeros')
        .select('*')
        .order('numero');

      if (error) {

        console.error(error);

        container.innerHTML = `
          <pre>${JSON.stringify(error, null, 2)}</pre>
        `;

        return;
      }

      container.innerHTML = '';

      data.forEach(n => {

        const div = document.createElement('div');

        div.textContent = n.numero;

        div.style.width = '50px';
        div.style.padding = '10px';
        div.style.textAlign = 'center';
        div.style.border = '1px solid #ccc';
        div.style.borderRadius = '6px';

        if (n.nome_comprador) {
          div.style.background = '#ddd';
          div.style.color = '#666';
        } else {
          div.style.background = '#4caf50';
          div.style.color = 'white';
        }

        container.appendChild(div);

      });

    }

    carregarNumeros();

  </script>

</body>
</html>
