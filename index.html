<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rifa da Empresa</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .numero { display: inline-block; width: 50px; padding: 10px; margin: 5px; text-align: center; border: 1px solid #ccc; }
    .verde { background-color: green; color: white; }
    .cinza { background-color: gray; color: white; }
    #status { margin-bottom: 20px; padding: 10px; background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Rifa da Empresa</h1>
  <div id="status">Carregando...</div>
  <div id="numeros"></div>

  <script>
    (async function() {
      const url = 'https://wrofweogvhgkocevlvdf.supabase.co/rest/v1/numeros?select=*';
      const chave = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Z3ZW9ndmhna29jZXZsdmRmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgwMzgxOSwiZXhwIjoyMDk0Mzc5ODE5fQ.-SJeuoVOHkuFH2UVs4GWsY0UNWYiWsSB211zKx5pmy0';
      
      const statusDiv = document.getElementById('status');
      const container = document.getElementById('numeros');
      
      try {
        const resposta = await fetch(url, {
          headers: { 
            'apikey': chave, 
            'Authorization': 'Bearer ' + chave 
          }
        });
        
        if (!resposta.ok) throw new Error('Erro: ' + resposta.status);
        
        const dados = await resposta.json();
        
        statusDiv.innerHTML = '✅ ' + dados.length + ' números disponíveis';
        
        container.innerHTML = '';
        for (let item of dados) {
          const div = document.createElement('div');
          div.className = 'numero ' + (item.nome_comprador ? 'cinza' : 'verde');
          div.textContent = item.numero;
          container.appendChild(div);
        }
      } catch (erro) {
        statusDiv.innerHTML = '❌ ' + erro.message;
      }
    })();
  </script>
</body>
</html>
