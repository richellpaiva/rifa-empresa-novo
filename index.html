<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa da Empresa</title>
  <style>
    .numero {
      display: inline-block;
      padding: 15px;
      margin: 5px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-weight: bold;
    }
    .disponivel {
      background-color: green;
      color: white;
    }
    .ocupado {
      background-color: gray;
      color: white;
    }
    #numeros {
      display: flex;
      flex-wrap: wrap;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <h1>Rifa da Empresa</h1>
  <div id="numeros">Carregando números...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      // URL CORRETA com o Project ID certo
      const SUPABASE_URL = 'https://wrofweogvhgkocevlvdj.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Znd2VvZ3ZoZ2tvY2V2bHZkZiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc4ODAzODE5LCJleHAiOjIwOTQzNzk4MTl9.LUrdkF9P-yWGFGwdV5dDm63UwvdbcQPpXqpZ5I3xu98';

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const container = document.getElementById('numeros');

      async function carregar() {
        try {
          const { data, error } = await supabase
            .from('numeros')
            .select('*')
            .order('numero', { ascending: true });

          if (error) throw new Error(error.message);

          if (!data || data.length === 0) {
            container.innerHTML = 'Nenhum número encontrado.';
            return;
          }

          container.innerHTML = '';
          for (const n of data) {
            const div = document.createElement('div');
            div.className = 'numero ' + (n.nome_comprador ? 'ocupado' : 'disponivel');
            div.textContent = n.numero;
            container.appendChild(div);
          }
        } catch (err) {
          container.innerHTML = 'Erro: ' + err.message;
        }
      }

      carregar();
    })();
  </script>

</body>
</html>
