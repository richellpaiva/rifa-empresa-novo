<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa da Empresa</title>
</head>
<body>
  <h1>Rifa da Empresa</h1>
  <div id="numeros" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configurações do Supabase
    const SUPABASE_URL = 'https://wrofweogvhgkoc evlvdf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Znd2VvZ3ZoZ2tvY2V2bHZkZiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc4ODAzODE5LCJleHAiOjIwOTQzNzk4MTl9.LUrdkF9P-yWGFGwdV5dDm63UwvdbcQPpXqpZ5I3xu98';

    // Renomeia a variável para evitar conflito
    const meuSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarNumeros() {
      const { data, error } = await meuSupabase.from('numeros').select('*');
      if (error) {
        console.error('Erro:', error);
        document.getElementById('numeros').innerHTML = 'Erro: ' + error.message;
        return;
      }
      const container = document.getElementById('numeros');
      container.innerHTML = '';
      data.forEach(n => {
        const div = document.createElement('div');
        div.textContent = n.numero;
        div.style.padding = '10px';
        div.style.border = '1px solid #ccc';
        div.style.background = n.nome_comprador ? '#ddd' : '#4caf50';
        div.style.color = n.nome_comprador ? '#666' : 'white';
        container.appendChild(div);
      });
    }
    carregarNumeros();
  </script>
</body>
</html>
